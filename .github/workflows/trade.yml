name: Paper Trade

on:
  workflow_dispatch:

  schedule:
    # 15:30 New York time during daylight saving time
    - cron: "30 19 * * 1-5"

    # 15:30 New York time during standard time
    - cron: "30 20 * * 1-5"

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run only at 15:30 New York time
        env:
          TZ: America/New_York
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NOW=$(date +%H:%M)

          if [ "$NOW" = "15:30" ]; then
            python trader.py
          else
            echo "Not 15:30 New York time. Skip."
          fi
